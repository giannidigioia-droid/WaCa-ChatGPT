<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Selezione foto Oasis · WaCa</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f3efe7;color:#183126}
header{padding:28px 5vw;position:sticky;top:0;z-index:10;background:rgba(243,239,231,.96);border-bottom:1px solid #d8d2c8}
h1{margin:0 0 8px;font-size:34px}p{margin:0;color:#66736b}
.grid{padding:24px 5vw 100px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{position:relative;background:white;border:2px solid transparent;border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.card:has(input:checked){border-color:#183126;box-shadow:0 0 0 3px rgba(24,49,38,.12)}
.card input{position:absolute;right:14px;top:14px;width:24px;height:24px;z-index:3}
.num{position:absolute;left:12px;top:12px;background:#183126;color:white;border-radius:999px;width:38px;height:38px;display:grid;place-items:center;font-weight:700;z-index:2}
.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#ddd}
.meta{padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.meta span{font-size:12px;color:#78827c}
.bar{position:fixed;bottom:0;left:0;right:0;background:#183126;color:white;padding:14px 5vw;display:flex;justify-content:space-between;align-items:center;gap:16px}
button{background:white;color:#183126;border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer}
#sel{font-weight:700}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head><body>
<header><h1>Scegli le foto Oasis</h1><p>Seleziona le immagini da usare nello slider Oasis, poi premi “Copia selezione”.</p></header>
<main class="grid">
<label class="card">
  <input type="checkbox" value="1">
  <div class="num">1</div>
  <img src="https://res.cloudinary.com/dfu9nzn8r/image/upload/f_auto,q_auto,c_limit,w_1000/v1789651756/Patio_Oasis_HD_gokk7g.png" alt="Patio Oasis principale" loading="lazy">
  <div class="meta"><b>Patio Oasis principale</b><span>1086×1448</span></div>
</label>
<label class="card">
  <input type="checkbox" value="2">
  <div class="num">2</div>
  <img src="https://res.cloudinary.com/dfu9nzn8r/image/upload/f_auto,q_auto,c_limit,w_1000/v1779982474/oasis_letto_hq.jpg" alt="Camera Oasis" loading="lazy">
  <div class="meta"><b>Camera Oasis</b><span>1280×900</span></div>
</label>
<label class="card">
  <input type="checkbox" value="3">
  <div class="num">3</div>
  <img src="https://res.cloudinary.com/dfu9nzn8r/image/upload/f_auto,q_auto,c_limit,w_1000/v1779981929/oasis_tavolo_hq.jpg" alt="Zona tavolo Oasis" loading="lazy">
  <div class="meta"><b>Zona tavolo Oasis</b><span>1280×900</span></div>
</label>
<label class="card">
  <input type="checkbox" value="4">
  <div class="num">4</div>
  <img src="https://res.cloudinary.com/dfu9nzn8r/image/upload/f_auto,q_auto,c_limit,w_1000/v1779980420/angolo_cottura_oasis_hq.jpg" alt="Angolo cottura Oasis" loading="lazy">
  <div class="meta"><b>Angolo cottura Oasis</b><span>1280×900</span></div>
</label>
<label class="card">
  <input type="checkbox" value="5">
  <div class="num">5</div>
  <img src="https://res.cloudinary.com/dfu9nzn8r/image/upload/f_auto,q_auto,c_limit,w_1000/v1779980031/bagno_oasis_hq.jpg" alt="Bagno Oasis" loading="lazy">
  <div class="meta"><b>Bagno Oasis</b><span>1280×900</span></div>
</label>
<label class="card">
  <input type="checkbox" value="6">
  <div class="num">6</div>
  <img src="https://res.cloudinary.com/dfu9nzn8r/image/upload/f_auto,q_auto,c_limit,w_1000/v1779976761/cucina_oasis_hq.jpg" alt="Cucina Oasis" loading="lazy">
  <div class="meta"><b>Cucina Oasis</b><span>1280×900</span></div>
</label>
<label class="card">
  <input type="checkbox" value="7">
  <div class="num">7</div>
  <img src="https://res.cloudinary.com/dfu9nzn8r/image/upload/f_auto,q_auto,c_limit,w_1000/v1779974521/patio_oasis_hq.jpg" alt="Patio Oasis 2" loading="lazy">
  <div class="meta"><b>Patio Oasis 2</b><span>1280×900</span></div>
</label></main>
<div class="bar"><div>Selezionate: <span id="sel">nessuna</span></div><button onclick="copySel()">Copia selezione</button></div>
<script>
const boxes=[...document.querySelectorAll('input[type=checkbox]')];
function values(){return boxes.filter(x=>x.checked).map(x=>x.value)}
function render(){document.getElementById('sel').textContent=values().join(', ')||'nessuna'}
boxes.forEach(x=>x.addEventListener('change',render));
async function copySel(){const v=values().join(', ');if(!v)return;await navigator.clipboard.writeText(v);document.querySelector('button').textContent='Copiato ✓';setTimeout(()=>document.querySelector('button').textContent='Copia selezione',1200)}
</script></body></html>
