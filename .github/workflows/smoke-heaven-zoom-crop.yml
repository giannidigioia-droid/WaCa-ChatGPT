name: Smoke Heaven zoom crop

on:
  push:
    branches: [heaven-zoom-crop-verified-smoke]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify Heaven zoom crop
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -f dist/index.html
          grep -q 'choice-media choice-media-heaven' dist/index.html
          grep -q 'width:118%' dist/index.html
          grep -q 'translate(-50%,-54%)' dist/index.html
          grep -q 'Patio_Heaven_ki0yrt.png' dist/index.html
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('dist/index.html','utf8');
          const scripts=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]).join('\n');
          fs.writeFileSync('/tmp/site.js',scripts);
          NODE
          node --check /tmp/site.js
