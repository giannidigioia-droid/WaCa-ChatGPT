name: Smoke Heaven final crop

on:
  push:
    branches: [heaven-final-crop-smoke]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify Heaven final crop
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -f dist/index.html
          grep -q 'c_crop,h_900,w_1458,x_20,y_90/c_fill,g_center,h_360,w_900/f_auto/q_auto/v1789651755/Patio_Heaven_ki0yrt.png' dist/index.html
          grep -q 'data-unit="heaven"' dist/index.html
