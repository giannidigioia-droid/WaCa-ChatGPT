name: Smoke Oasis selector

on:
  push:
    branches: [oasis-photo-selector-smoke]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify Oasis selector
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -f dist/oasis-select.html
          grep -q 'Scegli le foto Oasis' dist/oasis-select.html
          test "$(grep -o 'type="checkbox"' dist/oasis-select.html | wc -l)" -eq 7
          python - <<'PY'
          import re, pathlib
          h=pathlib.Path("dist/oasis-select.html").read_text()
          urls=sorted(set(re.findall(r'https://res\.cloudinary\.com/[^"]+',h)))
          assert len(urls)==7, len(urls)
          pathlib.Path("/tmp/urls.txt").write_text("\n".join(urls))
          PY
          while IFS= read -r url; do
            code="$(curl -L --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$url")"
            test "$code" = "200" || { echo "Image failed ($code): $url"; exit 1; }
          done < /tmp/urls.txt
