name: Smoke test calendar fix

on:
  push:
    branches: [calendar-fix-smoke]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe previous wac-chatgpt deployment calendar API
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://wac-chatgpt-hcv8ykaef-giannidigioia-droids-projects.vercel.app"
          for unit in dream heaven oasis; do
            echo "Testing $unit"
            code="$(curl -L --silent --show-error --max-time 20 -o /tmp/$unit.json -w '%{http_code}' "$BASE/api/calendar?unit=$unit&_=$(date +%s)")"
            echo "HTTP $code"
            cat /tmp/$unit.json || true
            test "$code" = "200"
            jq -e --arg unit "$unit" '.unit == $unit and (.periods | type == "array") and (.periods | length > 0)' /tmp/$unit.json >/dev/null
            echo "$unit periods: $(jq '.periods | length' /tmp/$unit.json)"
          done
